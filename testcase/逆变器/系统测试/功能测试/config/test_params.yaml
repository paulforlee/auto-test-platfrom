# 测试参数（电压范围、步长等）
# TODO: 按产品规格书填充；可由平台下发覆盖

ac_soft_start:
  voltage: 230.0        # 目标电压（V）
  frequency: 50.0       # 输出频率（Hz）
  steps: 10             # 升压级数
  interval: 0.5         # 每级间隔（s）

ac_power_cycle:
  times: 20             # 循环次数
  on_time: 3.0          # 上电时长（s）
  off_time: 2.0         # 断电间隔（s）
  voltage: 230.0
  frequency: 50.0

pv_iv_curve:
  v_start: 0.0          # 起始电压（V）
  v_end: 500.0          # 终止电压（V）
  v_step: 5.0           # 电压步长（V）
  current_limit: 10.0   # 电流限值（A）

pv_mppt:
  irradiance_profile:   # [(时刻s, 辐照度W/m2), ...]
    - [0, 1000]
    - [60, 800]
    - [120, 600]
    - [180, 1000]
  settle_time: 10.0     # 每档稳定时间（s）
  min_tracking_efficiency: 0.98   # 最小跟踪效率

inverter_efficiency:
  load_points: [25, 50, 75, 100]  # 负载点（%额定功率）
  settle_time: 60.0               # 每点稳定时间（s）
  min_efficiency: 0.96            # 满载最小效率

inverter_protection:
  cases:
    - name: 过压保护
      type: ac_over_voltage
      param: voltage
      value: 264.0       # 触发值（V）
    - name: 欠压保护
      type: ac_under_voltage
      param: voltage
      value: 180.0
    - name: 过流保护
      type: pv_over_current
      param: current
      value: 12.0        # 触发值（A）
  max_reaction_time: 2.0 # 最大保护动作时间（s）
