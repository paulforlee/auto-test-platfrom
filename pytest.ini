[pytest]
testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

markers =
    ac: AC 源相关用例（PRE2020S / IT6000C）
    pv: PV 源模拟器相关用例
    meter: 功分仪相关用例
    inverter: 逆变器相关用例
    hardware: 需要连接真实设备（默认离线/模拟运行）
    mock: 使用模拟设备运行，无需真实硬件

# TODO: 按需调整日志输出
# log_cli = true
# log_cli_level = INFO
